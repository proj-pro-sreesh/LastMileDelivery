# Render Blueprint — provisions the web service and a managed PostgreSQL database.
# Deploy: Render Dashboard -> New -> Blueprint -> point at this repository.
services:
  - type: web
    name: lastmile-delivery-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lastmile-delivery-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://lastmile-delivery-frontend.onrender.com
      - key: NOTIFICATIONS_MODE
        value: mock
      - key: EMAIL_PROVIDER
        value: mock
      - key: SMS_PROVIDER
        value: mock

databases:
  - name: lastmile-delivery-db
    plan: free
    databaseName: lastmile_delivery
    user: lastmile
